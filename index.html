<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Bears Basketball</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            touch-action: none;
        }

        #game-header {
            position: absolute;
            top: 0;
            width: 100%;
            text-align: center;
            padding: 10px 0;
            font-weight: bold;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.1);
            z-index: 10;
        }

        #ui-layer {
            position: absolute;
            top: 50px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            z-index: 10;
            pointer-events: none;
        }

        .stat-box {
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        #screen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 12px;
            margin: 10px;
            cursor: pointer;
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
        }

        #message-popup {
            position: fixed;
            top: 40%;
            width: 100%;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff9800;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 50;
        }

        canvas { display: block; }
    </style>
</head>
<body>

<div id="game-header">баскетбол 🏀 NFT мишки</div>

<div id="ui-layer">
    <div class="stat-box">Время: <span id="timer">30</span>с</div>
    <div class="stat-box">Уровень: <span id="level">1</span></div>
    <div class="stat-box">Счет: <span id="score">0</span></div>
</div>

<div id="message-popup">Отличный бросок!</div>

<div id="screen-overlay">
    <h1 id="screen-title">NFT BEARS</h1>
    <p id="screen-desc">Забей как можно больше мячей!</p>
    <button onclick="startGame()">Играть</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Настройка темы
    document.documentElement.style.setProperty('--tg-theme-bg-color', tg.backgroundColor);
    document.documentElement.style.setProperty('--tg-theme-text-color', tg.textColor);

    const Engine = Matter.Engine,
          Render = Matter.Render,
          Runner = Matter.Runner,
          Bodies = Matter.Bodies,
          Composite = Matter.Composite,
          Events = Matter.Events,
          Mouse = Matter.Mouse,
          MouseConstraint = Matter.MouseConstraint;

    let engine, render, runner;
    let ball, rings = [], particles = [];
    let score = 0, level = 1, timeLeft = 30;
    let gameActive = false;
    let ringsInLevel = 0;
    let ringsHitInLevel = 0;
    let timerInterval;

    const phrases = [
        "Продолжай в том же духе!",
        "Ты будущий топ-1!",
        "Мишки гордятся тобой!",
        "Невероятная точность!",
        "Легендарный уровень!"
    ];

    function initPhysics() {
        engine = Engine.create();
        render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: 'transparent'
            }
        });

        Render.run(render);
        runner = Runner.create();
        Runner.run(runner, engine);

        // Стены
        const ground = Bodies.rectangle(window.innerWidth/2, window.innerHeight + 50, window.innerWidth, 100, { isStatic: true });
        const leftWall = Bodies.rectangle(-50, window.innerHeight/2, 100, window.innerHeight, { isStatic: true });
        const rightWall = Bodies.rectangle(window.innerWidth + 50, window.innerHeight/2, 100, window.innerHeight, { isStatic: true });
        Composite.add(engine.world, [ground, leftWall, rightWall]);

        createBall();
        setupLevel();

        // Логика броска (Drag & Shoot)
        let isDragging = false;
        let startPos = { x: 0, y: 0 };

        window.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            const dist = Math.hypot(touch.clientX - ball.position.x, touch.clientY - ball.position.y);
            if (dist < 50) {
                isDragging = true;
                startPos = { x: touch.clientX, y: touch.clientY };
            }
        });

        window.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            const touch = e.changedTouches[0];
            const endPos = { x: touch.clientX, y: touch.clientY };
            
            const force = {
                x: (startPos.x - endPos.x) * 0.005,
                y: (startPos.y - endPos.y) * 0.005
            };
            
            Matter.Body.applyForce(ball, ball.position, force);
        });

        Events.on(engine, 'afterUpdate', checkCollisions);
    }

    function createBall() {
        if (ball) Composite.remove(engine.world, ball);
        ball = Bodies.circle(window.innerWidth / 2, window.innerHeight - 100, 25, {
            restitution: 0.8,
            friction: 0.05,
            render: { fillStyle: '#ff5722' } // Можно заменить на спрайт мишки
        });
        Composite.add(engine.world, ball);
    }

    function setupLevel() {
        rings.forEach(r => Composite.remove(engine.world, r.body));
        rings = [];
        ringsHitInLevel = 0;
        ringsInLevel = Math.floor(Math.random() * 5) + 3; // От 3 до 7 колец
        
        for (let i = 0; i < ringsInLevel; i++) {
            const x = Math.random() * (window.innerWidth - 100) + 50;
            const y = 150 + (i * 100);
            const ring = Bodies.rectangle(x, y, 80, 10, { 
                isStatic: true, 
                isSensor: true,
                render: { fillStyle: '#2196f3' } 
            });
            rings.push({ body: ring, hit: false });
            Composite.add(engine.world, ring);
        }
        document.getElementById('level').innerText = level;
    }

    function checkCollisions() {
        rings.forEach(ring => {
            if (!ring.hit) {
                const dist = Math.hypot(ball.position.x - ring.body.position.x, ball.position.y - ring.body.position.y);
                if (dist < 40 && ball.velocity.y > 0) {
                    ring.hit = true;
                    ring.body.render.fillStyle = '#4caf50';
                    score += 10;
                    ringsHitInLevel++;
                    document.getElementById('score').innerText = score;
                    spawnParticles(ring.body.position.x, ring.body.position.y);
                    
                    if (ringsHitInLevel >= ringsInLevel) {
                        nextLevel();
                    }
                }
            }
        });

        // Если мяч улетел вниз
        if (ball.position.y > window.innerHeight) {
            createBall();
        }
    }

    function spawnParticles(x, y) {
        const types = ['🌟', '❤️', '⭕'];
        for (let i = 0; i < 8; i++) {
            const el = document.createElement('div');
            el.innerHTML = types[Math.floor(Math.random() * types.length)];
            el.style.position = 'fixed';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.fontSize = '20px';
            el.style.transition = 'all 1.2s ease-out';
            el.style.pointerEvents = 'none';
            el.style.zIndex = '20';
            document.body.appendChild(el);

            setTimeout(() => {
                el.style.transform = XXXINLINECODEXXX1XXXINLINECODEXXX;
                el.style.opacity = '0';
            }, 10);

            setTimeout(() => el.remove(), 1500);
        }
    }

    function nextLevel() {
        level++;
        showPopup(phrases[Math.floor(Math.random() * phrases.length)]);
        setTimeout(setupLevel, 500);
    }

    function showPopup(text) {
        const p = document.getElementById('message-popup');
        p.innerText = text;
        p.style.opacity = '1';
        setTimeout(() => p.style.opacity = '0', 2000);
    }

    function startGame() {
        document.getElementById('screen-overlay').style.display = 'none';
        score = 0;
        level = 1;
        timeLeft = 30;
        gameActive = true;
        
        document.getElementById('score').innerText = score;
        document.getElementById('timer').innerText = timeLeft;
        
        if (!engine) initPhysics();
        else setupLevel();

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) endGame();
        }, 1000);

        // Музыка (раскомментировать при наличии файла)
        // const audio = new Audio('basketball_beat.mp3');
        // audio.loop = true;
        // audio.play();
    }

    function endGame() {
        gameActive = false;
        clearInterval(timerInterval);
        const overlay = document.getElementById('screen-overlay');
        overlay.style.display = 'flex';
        document.getElementById('screen-title').innerText = "ВРЕМЯ ВЫШЛО!";
        document.getElementById('screen-desc').innerText = XXXINLINECODEXXX2XXXINLINECODEXXX;
        
        // Кнопки после игры
        overlay.innerHTML = `
            <h1>ФИНАЛ</h1>
            <p>Результат: ${score}</p>
            <button onclick="startGame()">Играть снова</button>
            <button onclick="shareResult()">Поделиться</button>
        `;
    }

    function shareResult() {
        const text = XXXINLINECODEXXX3XXXINLINECODEXXX;
        tg.shareToStory ? tg.shareToStory('https://your-game-url.com/preview.jpg', {text}) : alert("Скопировано: " + text);
        // Или через switchInlineQuery
        tg.switchInlineQuery(text);
    }

    // Ресайз
    window.addEventListener('resize', () => {
        if (render) {
            render.canvas.width = window.innerWidth;
            render.canvas.height = window.innerHeight;
        }
    });

</script>
</body>
</html>
