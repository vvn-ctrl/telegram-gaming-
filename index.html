<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Баскетбол 🏀 NFT Мишки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #999999);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 10;
        }

        header {
            text-align: center;
            padding: 10px;
            font-weight: bold;
            background: rgba(0,0,0,0.05);
            pointer-events: auto;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 5px;
            font-size: 0.9rem;
        }

        #game-canvas {
            display: block;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .btn {
            background: var(--button-color);
            color: var(--button-text);
            border: none;
            padding: 15px 40px;
            border-radius: 12px;
            font-size: 1.1rem;
            margin-top: 15px;
            cursor: pointer;
            pointer-events: auto;
            width: 80%;
            max-width: 280px;
        }

        .hidden { display: none !important; }

        #level-msg {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            z-index: 50;
            width: 80%;
            animation: fadeInOut 2s forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -40%); }
            20% { opacity: 1; transform: translate(-50%, -50%); }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

<div id="ui-layer">
    <header>баскетбол 🏀 NFT мишки</header>
    <div class="stats-bar">
        <div>Уровень: <span id="level-val">1</span></div>
        <div>Цель: <span id="target-val">0/3</span></div>
        <div>Время: <span id="timer-val">30</span>с</div>
    </div>
</div>

<canvas id="game-canvas"></canvas>

<div id="overlay">
    <h2 id="result-title">NFT Basketball</h2>
    <p id="result-score"></p>
    <button id="start-btn" class="btn">Играть</button>
    <button id="share-btn" class="btn hidden">Поделиться результатом</button>
</div>

<div id="msg-container"></div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    
    // Элементы интерфейса
    const timerEl = document.getElementById('timer-val');
    const levelEl = document.getElementById('level-val');
    const targetEl = document.getElementById('target-val');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const shareBtn = document.getElementById('share-btn');
    const msgContainer = document.getElementById('msg-container');

    // Состояние игры
    let score = 0;
    let totalScore = 0;
    let level = 1;
    let timeLeft = 30;
    let targetInLevel = 3;
    let scoredInLevel = 0;
    let isPlaying = false;
    let gameTimer;

    // Физика и объекты
    const ball = { x: 0, y: 0, r: 15, vx: 0, vy: 0, launched: false, inHoop: true };
    const hoop = { x: 0, y: 0, w: 60, h: 10 };
    let particles = [];
    let dragStart = null;
    let dragCurrent = null;

    function initCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();

    function spawnHoop() {
        hoop.x = 50 + Math.random() * (canvas.width - 100);
        hoop.y = 150 + Math.random() * (canvas.height - 300);
        if (!ball.launched) {
            ball.x = hoop.x + hoop.w/2;
            ball.y = hoop.y;
        }
    }

    function createParticles() {
        const types = ['⭐', '❤️', '🔵'];
        for(let i=0; i<8; i++) {
            particles.push({
                x: ball.x,
                y: ball.y,
                text: types[Math.floor(Math.random()*types.length)],
                vx: (Math.random()-0.5)*10,
                vy: (Math.random()-0.5)*10,
                life: 1.0
            });
        }
    }

    function showPhrase() {
        const div = document.createElement('div');
        div.id = 'level-msg';
        div.innerHTML = XXXINLINECODEXXX0XXXINLINECODEXXX;
        msgContainer.appendChild(div);
        setTimeout(() => div.remove(), 2000);
    }

    function startGame() {
        totalScore = 0;
        level = 1;
        timeLeft = 30;
        startLevel();
        isPlaying = true;
        overlay.classList.add('hidden');
        
        gameTimer = setInterval(() => {
            timeLeft--;
            timerEl.textContent = timeLeft;
            if(timeLeft <= 0) endGame();
        }, 1000);

        requestAnimationFrame(gameLoop);
    }

    function startLevel() {
        scoredInLevel = 0;
        targetInLevel = 3 + Math.floor(level / 2);
        if(targetInLevel > 7) targetInLevel = 7;
        
        levelEl.textContent = level;
        targetEl.textContent = XXXINLINECODEXXX1XXXINLINECODEXXX;
        spawnHoop();
    }

    function endGame() {
        isPlaying = false;
        clearInterval(gameTimer);
        overlay.classList.remove('hidden');
        shareBtn.classList.remove('hidden');
        document.getElementById('result-title').textContent = "Время вышло!";
        document.getElementById('result-score').textContent = XXXINLINECODEXXX2XXXINLINECODEXXX;
        startBtn.textContent = "Играть снова";
    }

    // Управление
    canvas.addEventListener('touchstart', (e) => {
        if(!isPlaying || ball.launched) return;
        dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });

    canvas.addEventListener('touchmove', (e) => {
        if(!dragStart) return;
        dragCurrent = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });

    canvas.addEventListener('touchend', () => {
        if(!dragStart || !dragCurrent) return;
        const dx = dragStart.x - dragCurrent.x;
        const dy = dragStart.y - dragCurrent.y;
        
        ball.vx = dx * 0.15;
        ball.vy = dy * 0.15;
        ball.launched = true;
        dragStart = null;
        dragCurrent = null;
        tg.HapticFeedback.impactOccurred('medium');
    });

    function update() {
        if(!isPlaying) return;

        // Физика мяча
        if(ball.launched) {
            ball.vy += 0.5; // Гравитация
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Отскоки от стен
            if(ball.x < 0 || ball.x > canvas.width) ball.vx *= -0.8;

            // Проверка попадания в кольцо
            if(ball.vy > 0 && ball.y > hoop.y && ball.y < hoop.y + 20) {
                if(ball.x > hoop.x && ball.x < hoop.x + hoop.w) {
                    // Попадание!
                    scoredInLevel++;
                    totalScore += 10;
                    ball.launched = false;
                    ball.vx = 0; ball.vy = 0;
                    tg.HapticFeedback.notificationOccurred('success');
                    createParticles();
                    
                    if(scoredInLevel >= targetInLevel) {
                        level++;
                        showPhrase();
                        startLevel();
                    } else {
                        targetEl.textContent = XXXINLINECODEXXX3XXXINLINECODEXXX;
                        spawnHoop();
                    }
                }
            }

            // Если улетел за экран
            if(ball.y > canvas.height) {
                ball.launched = false;
                ball.x = hoop.x + hoop.w/2;
                ball.y = hoop.y;
                tg.HapticFeedback.notificationOccurred('error');
            }
        }

        // Частицы
        particles.forEach((p, i) => {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.02;
            if(p.life <= 0) particles.splice(i, 1);
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Траектория прицеливания
        if(dragStart && dragCurrent) {
            ctx.beginPath();
            ctx.setLineDash([5, 5]);
            ctx.moveTo(ball.x, ball.y);
            const dx = dragStart.x - dragCurrent.x;
            const dy = dragStart.y - dragCurrent.y;
            ctx.lineTo(ball.x + dx, ball.y + dy);
            ctx.strokeStyle = 'var(--hint-color)';
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // Кольцо
        ctx.fillStyle = "#ff4500";
        ctx.fillRect(hoop.x, hoop.y, hoop.w, hoop.h);
        ctx.strokeStyle = "rgba(255,255,255,0.5)";
        ctx.strokeRect(hoop.x, hoop.y + 10, hoop.w, 40); // Сетка

        // Мяч
        ctx.font = "30px Arial";
        ctx.textAlign = "center";
        ctx.fillText("🏀", ball.x, ball.y + 10);

        // Частицы
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillText(p.text, p.x, p.y);
        });
        ctx.globalAlpha = 1;

        if(isPlaying) requestAnimationFrame(gameLoop);
    }

    function gameLoop() {
        update();
        draw();
    }

    startBtn.addEventListener('click', startGame);
    
    shareBtn.addEventListener('click', () => {
        const text = XXXINLINECODEXXX4XXXINLINECODEXXX;
        tg.openTelegramLink(XXXINLINECODEXXX5XXXINLINECODEXXX);
    });

</script>
</body>
</html>
