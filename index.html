<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dunk Shot</title>
<style>
  body {
    margin: 0;
    background: #222;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
  }
  h1 {
    margin: 10px;
  }
  #gameCanvas {
    background: #444;
    display: block;
    margin: 0 auto;
    border: 2px solid #aaa;
  }
  #score {
    font-size: 1.2em;
    margin: 10px;
  }
  #restartBtn {
    padding: 10px 20px;
    font-size: 1em;
    margin: 10px;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>Dunk Shot</h1>
<canvas id="gameCanvas" width="400" height="600"></canvas>
<div id="score">Очков: 0</div>
<button id="restartBtn">Играть снова</button>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let ball = {
  x: 200,
  y: 500,
  radius: 15,
  vx: 0,
  vy: 0,
  isMoving: false
};

const hoop = {
  x: 200,
  y: 150,
  width: 60,
  height: 10
};

let score = 0;
let isAiming = false;
let aimStart = {x:0, y:0};
let aimEnd = {x:0, y:0};

function resetBall() {
  ball.x = 200;
  ball.y = 500;
  ball.vx = 0;
  ball.vy = 0;
  ball.isMoving = false;
}

function drawHoop() {
  ctx.fillStyle = 'red';
  ctx.fillRect(hoop.x - hoop.width/2, hoop.y, hoop.width, hoop.height);
}

function drawBall() {
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
  ctx.fillStyle = 'orange';
  ctx.fill();
}

function update() {
  if (ball.isMoving) {
    ball.vy += 0.3; // гравитация
    ball.x += ball.vx;
    ball.y += ball.vy;

    // Проверка попадания в корзину
    if (
      ball.y - ball.radius < hoop.y + 10 && 
      ball.y + ball.radius > hoop.y && 
      ball.x > hoop.x - hoop.width/2 && 
      ball.x < hoop.x + hoop.width/2 &&
      ball.vy > 0 // чтобы проверить вход с нижней стороны
    ) {
      score++;
      document.getElementById('score').innerText = 'Очков: ' + score;
      resetBall();
    }

    // Граница - падение
    if (ball.y - ball.radius > canvas.height) {
      resetBall();
    }
  }
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawHoop();
  drawBall();

  // Если есть прицеливание, рисуем линию
  if (isAiming) {
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(aimStart.x, aimStart.y);
    ctx.lineTo(aimEnd.x, aimEnd.y);
    ctx.stroke();
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// Обработка мыши / касания
canvas.addEventListener('mousedown', (e) => {
  isAiming = true;
  aimStart.x = e.offsetX;
  aimStart.y = e.offsetY;
});
canvas.addEventListener('mouseup', (e) => {
  if (isAiming) {
    isAiming = false;
    aimEnd.x = e.offsetX;
    aimEnd.y = e.offsetY;

    // Вычисляем силу и угол
    const dx = aimStart.x - aimEnd.x;
    const dy = aimStart.y - aimEnd.y;
    ball.vx = dx * 0.2;
    ball.vy = dy * 0.2;
    ball.isMoving = true;
  }
});
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    const touch = e.touches[0];
    isAiming = true;
    aimStart.x = touch.clientX - canvas.getBoundingClientRect().left;
    aimStart.y = touch.clientY - canvas.getBoundingClientRect().top;
  }
});
canvas.addEventListener('touchend', (e) => {
  if (isAiming) {
    isAiming = false;
    const touch = e.changedTouches[0];
    aimEnd.x = touch.clientX - canvas.getBoundingClientRect().left;
    aimEnd.y = touch.clientY - canvas.getBoundingClientRect().top;

    const dx = aimStart.x - aimEnd.x;
    const dy = aimStart.y - aimEnd.y;
    ball.vx = dx * 0.2;
    ball.vy = dy * 0.2;
    ball.isMoving = true;
  }
});

// Обработка кнопки "играть снова"
document.getElementById('restartBtn').onclick=()=> {
  score=0;
  document.getElementById('score').innerText='Очков: '+score;
  resetBall();
};

gameLoop();
</script>

</body>
</html>
