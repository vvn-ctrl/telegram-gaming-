<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Bears Basketball</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --button-color: var(--tg-theme-button-color, #3390ec);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #707579);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #game-ui {
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }

        .header-title {
            font-size: 18px;
            font-weight: bold;
            padding: 10px;
            background: rgba(0,0,0,0.03);
            text-transform: uppercase;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        #canvas {
            display: block;
            touch-action: none;
        }

        /* Модальные окна */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .btn {
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            margin: 10px;
            cursor: pointer;
            width: 80%;
            max-width: 300px;
            pointer-events: auto;
        }

        .hidden { display: none; }

        #motivation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
            color: var(--button-color);
            text-align: center;
            width: 80%;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>

<div id="game-ui">
    <div class="header-title">баскетбол 🏀 NFT мишки</div>
    <div class="stats">
        <div>Уровень: <span id="lvl">1</span></div>
        <div>Цель: <span id="goal">0/3</span></div>
        <div>Время: <span id="timer">30</span></div>
    </div>
</div>

<div id="motivation">Великолепно!</div>

<canvas id="canvas"></canvas>

<div id="start-screen" class="modal">
    <h1 style="font-size: 40px;">🐻🏀</h1>
    <h2>NFT Basketball</h2>
    <p style="color: var(--hint-color)">Забивай мячи в кольца, проходи уровни и стань первым!</p>
    <button class="btn" onclick="startGame()">Играть</button>
</div>

<div id="end-screen" class="modal hidden">
    <h2 id="end-title">Время вышло!</h2>
    <h1 id="final-score">0</h1>
    <p id="phrase-display"></p>
    <button class="btn" onclick="startGame()">Играть снова</button>
    <button class="btn" style="background: #31d679;" onclick="shareResult()">Поделиться результатом</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let score = 0;
let level = 1;
let timeLeft = 30;
let goalsDone = 0;
let goalsNeed = 3;
let isPlaying = false;
let gameInterval;

// Игровая логика
let ball = { x: 0, y: 0, radius: 15, vx: 0, vy: 0, launched: false };
let hoop = { x: 0, y: 0, width: 70, height: 10 };
let particles = [];
let drag = { startX: 0, startY: 0, isDragging: false };

function init() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    resetBall();
    spawnHoop();
}

function resetBall() {
    ball.launched = false;
    ball.vx = 0;
    ball.vy = 0;
    ball.x = canvas.width / 2;
    ball.y = canvas.height - 100;
}

function spawnHoop() {
    hoop.x = 50 + Math.random() * (canvas.width - 150);
    hoop.y = 150 + Math.random() * (canvas.height / 2);
}

function createParticles(x, y) {
    const symbols = ['⭐', '❤️', '🔵', '✨'];
    for (let i = 0; i < 10; i++) {
        particles.push({
            x: x,
            y: y,
            s: symbols[Math.floor(Math.random() * symbols.length)],
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 1.0
        });
    }
}

function showMotivation() {
    const el = document.getElementById('motivation');
    el.style.opacity = '1';
    setTimeout(() => el.style.opacity = '0', 1500);
}

function startGame() {
    score = 0;
    level = 1;
    timeLeft = 30;
    goalsDone = 0;
    goalsNeed = 3;
    isPlaying = true;
    
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('end-screen').classList.add('hidden');
    
    updateStats();
    resetBall();
    spawnHoop();

    if (gameInterval) clearInterval(gameInterval);
    gameInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').textContent = timeLeft;
        if (timeLeft <= 0) endGame();
    }, 1000);

    requestAnimationFrame(update);
}

function updateStats() {
    document.getElementById('lvl').textContent = level;
    document.getElementById('goal').textContent = XXXINLINECODEXXX1XXXINLINECODEXXX;
}

function endGame() {
    isPlaying = false;
    clearInterval(gameInterval);
    document.getElementById('end-screen').classList.remove('hidden');
    document.getElementById('final-score').textContent = XXXINLINECODEXXX2XXXINLINECODEXXX;
    document.getElementById('phrase-display').textContent = "Продолжай в том же духе и ты сможешь стать топ один!";
    tg.HapticFeedback.notificationOccurred('warning');
}

function shareResult() {
    const text = XXXINLINECODEXXX3XXXINLINECODEXXX;
    tg.openTelegramLink(XXXINLINECODEXXX4XXXINLINECODEXXX);
}

// Управление
canvas.addEventListener('touchstart', e => {
    if (!isPlaying || ball.launched) return;
    drag.startX = e.touches[0].clientX;
    drag.startY = e.touches[0].clientY;
    drag.isDragging = true;
});

canvas.addEventListener('touchmove', e => {
    if (!drag.isDragging) return;
    drag.currentX = e.touches[0].clientX;
    drag.currentY = e.touches[0].clientY;
});

canvas.addEventListener('touchend', e => {
    if (!drag.isDragging) return;
    const dx = drag.startX - e.changedTouches[0].clientX;
    const dy = drag.startY - e.changedTouches[0].clientY;
    
    ball.vx = dx * 0.12;
    ball.vy = dy * 0.12;
    ball.launched = true;
    drag.isDragging = false;
    tg.HapticFeedback.impactOccurred('medium');
});

function update() {
    if (!isPlaying) return;

    if (ball.launched) {
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.vy += 0.4; // Гравитация

        // Проверка попадания
        if (ball.vy > 0 && ball.x > hoop.x && ball.x < hoop.x + hoop.width &&
            ball.y > hoop.y && ball.y < hoop.y + 20) {
            
            score += 10;
            goalsDone++;
            createParticles(ball.x, ball.y);
            tg.HapticFeedback.notificationOccurred('success');
            
            if (goalsDone >= goalsNeed) {
                level++;
                goalsDone = 0;
                goalsNeed = Math.min(7, 3 + Math.floor(level/2));
                showMotivation();
            }
            
            updateStats();
            resetBall();
            spawnHoop();
        }

        // Выход за границы
        if (ball.y > canvas.height || ball.x < 0 || ball.x > canvas.width) {
            resetBall();
            tg.HapticFeedback.impactOccurred('light');
        }
    }

    draw();
    requestAnimationFrame(update);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Рисование траектории
    if (drag.isDragging) {
        ctx.beginPath();
        ctx.setLineDash([5, 5]);
        ctx.moveTo(ball.x, ball.y);
        ctx.lineTo(ball.x + (drag.startX - drag.currentX), ball.y + (drag.startY - drag.currentY));
        ctx.strokeStyle = 'var(--hint-color)';
        ctx.stroke();
        ctx.setLineDash([]);
    }

    // Кольцо
    ctx.fillStyle = '#ff4500';
    ctx.fillRect(hoop.x, hoop.y, hoop.width, 10);
    ctx.strokeStyle = '#ddd';
    ctx.strokeRect(hoop.x + 5, hoop.y + 10, hoop.width - 10, 30);

    // Мяч
    ctx.font = "30px Arial";
    ctx.textAlign = "center";
    ctx.fillText("🏀", ball.x, ball.y + 10);

    // Частицы
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;
        ctx.globalAlpha = p.life;
        ctx.fillText(p.s, p.x, p.y);
        if (p.life <= 0) particles.splice(i, 1);
    }
    ctx.globalAlpha = 1;
}

window.addEventListener('resize', init);
init();

</script>
</body>
</html>
